unbindall

bind "ESCAPE" 		"cancelselect"
bind "`" 			"toggleconsole"
bind "w"			"+forward"
bind "s"			"+back"
bind "a"			"+moveleft"
bind "d"			"+moveright"
bind "SPACE"		"+jump"
bind "CTRL"			"+duck"
bind "e"			"+use"
bind "c"			"impulse 50"
bind "r"			"+reload"
bind "ALT"			"+walk"
bind "SHIFT"		"+speed"
bind "MOUSE1"		"+attack"
bind "MOUSE2"		"+attack2"
bind "MOUSE3"		"+grenade1"
bind "g"			"+grenade1"
bind "f"			"impulse 100"
bind "F5"			"jpeg"
bind "F6"			"save quick"
bind "F9"			"load quick"
bind "z"			"+zoom"

bind_mac "ALT"	"+duck"
bind_mac "LWIN"	"+walk"
unbind_mac "CTRL" 
bind_mac "F8"			"load quick"
unbind_mac "F9"

