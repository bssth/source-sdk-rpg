// [Mapbase port] Engine convar overrides applied at every startup.

// Disable the legacy lightmap hunk allocator. This removes the artificial
// "Engine hunk overflow" cap on lightmaps and lets large maps load with
// full-quality lighting. Mapbase ships with this set to 0 by default.
r_hunkalloclightmaps 0

// Game Instructor on by default — env_instructor_hint entities won't
// fire while this is 0.
gameinstructor_enable 1
